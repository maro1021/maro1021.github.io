/* v1.33 — Storybook theme + rapid page-flip character opening. Functional layout preserved. */
:root{
  --book-paper:color-mix(in srgb,#fffaf0 88%,var(--accent) 12%);

  --book-desk:color-mix(in srgb,#e8dfcf 82%,var(--accent) 18%);
  --book-shadow:rgba(74,57,38,.16);
}
html[data-theme="dark"]{
  --book-paper:color-mix(in srgb,var(--panel) 91%,#8b7657 9%);
  --book-paper-2:color-mix(in srgb,var(--panel2) 94%,#9c8561 6%);
  --book-edge:color-mix(in srgb,var(--line) 70%,var(--accent) 30%);

body{

    linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px) 0 0/26px 26px,
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/26px 26px,

/* v1.38 — lively kawaii storybook effects. Visual-only: no app behavior/layout changes. */
:root{
  --fx-a:color-mix(in srgb,var(--accent) 72%,#ffffff 28%);
  --fx-b:color-mix(in srgb,var(--theme-secondary) 68%,#ffffff 32%);
  --fx-c:color-mix(in srgb,var(--theme-deco) 66%,#ffffff 34%);
}
body{position:relative;overflow-x:hidden}
body:before,body:after{
  content:"";position:fixed;pointer-events:none;z-index:-2;border-radius:50%;filter:blur(16px);opacity:.22;
  width:360px;height:360px;animation:storybookAura 12s ease-in-out infinite alternate;
}
body:before{left:-150px;top:15%;background:radial-gradient(circle,var(--fx-b),transparent 67%)}
body:after{right:-170px;top:52%;background:radial-gradient(circle,var(--fx-c),transparent 68%);animation-delay:-5s}

/* Floating ambient sparkles: intentionally tiny and non-interactive. */
#ambientStoryFx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2;contain:strict}
#ambientStoryFx .fxStar{
  --s:5px;position:absolute;left:var(--x);top:110%;width:var(--s);height:var(--s);opacity:0;
  color:var(--fx-a);filter:drop-shadow(0 0 7px color-mix(in srgb,currentColor 35%,transparent));
  animation:ambientFloat var(--dur) linear infinite;animation-delay:var(--delay);will-change:transform,opacity;
}
#ambientStoryFx .fxStar:nth-child(3n+2){color:var(--fx-b)}
#ambientStoryFx .fxStar:nth-child(3n){color:var(--fx-c)}
#ambientStoryFx .fxStar:before{content:"✦";display:block;font-size:calc(var(--s) * 2.2);line-height:1;animation:ambientTwinkle 1.9s ease-in-out infinite alternate}
#ambientStoryFx .fxStar.dot:before{content:"";width:var(--s);height:var(--s);border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}

/* Bookish top area: gentle shimmer instead of static decoration. */
.topbar{overflow:hidden}
.topbar:after{
  content:"";position:absolute;inset:-45% auto -45% -35%;width:30%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.34),transparent);transform:skewX(-18deg);
  animation:topbarGlint 8s ease-in-out infinite;
}
.brandMark{animation:brandBob 4.6s ease-in-out infinite}
.brandMark:before{
  content:"✦";position:absolute;right:-7px;top:-8px;font-size:12px;color:var(--fx-b);text-shadow:0 0 10px currentColor;
  animation:tinyStarPop 2.2s ease-in-out infinite;
}

/* Filter/chapter selections have a soft magical pulse, not extra badges. */
.filterChip.active,.chapterTab.active,.segment button.active{
  position:relative;isolation:isolate;
}
.filterChip.active:after,.chapterTab.active:after,.segment button.active:after{
  content:"";position:absolute;inset:-4px;border-radius:inherit;z-index:-1;pointer-events:none;
  border:1px solid color-mix(in srgb,var(--accent) 36%,transparent);opacity:0;
  animation:selectedHalo 2.8s ease-out infinite;
}

/* Cards feel like little illustrated books. */
.card{transform-origin:center bottom;animation:bookCardArrive .48s cubic-bezier(.2,.8,.22,1) both}
.card:nth-child(2){animation-delay:.045s}.card:nth-child(3){animation-delay:.09s}.card:nth-child(4){animation-delay:.135s}
.card:nth-child(5){animation-delay:.18s}.card:nth-child(6){animation-delay:.225s}.card:nth-child(n+7){animation-delay:.26s}
.card:after{
  content:"";position:absolute;z-index:5;pointer-events:none;inset:0;border-radius:inherit;opacity:0;
  background:linear-gradient(118deg,transparent 28%,rgba(255,255,255,.22) 43%,rgba(255,255,255,.38) 49%,transparent 61%);
  transform:translateX(-120%);transition:opacity .2s ease;
}

}
.card:active{transform:translateY(-1px) scale(.992)!important}
.card .cover:after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.3;
  background:radial-gradient(circle at 18% 13%,rgba(255,255,255,.38) 0 1px,transparent 2px),radial-gradient(circle at 82% 18%,rgba(255,255,255,.26) 0 1.2px,transparent 2.2px);
  background-size:44px 44px,58px 58px;animation:coverDustDrift 13s linear infinite;
}

/* Buttons have a tiny press/bounce and a traveling sheen. */
.btn,.iconMini,.genreManageBtn,.genreAddCharacter{position:relative;overflow:hidden;transform-origin:center}
.btn:active,.iconMini:active,.genreManageBtn:active,.genreAddCharacter:active{transform:scale(.955)!important}
.btn.primary:after,.genreAddCharacter:after{
  content:"";position:absolute;top:-45%;bottom:-45%;left:-42%;width:22%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.46),transparent);transform:skewX(-18deg);
  animation:primarySheen 4.8s ease-in-out infinite;
}

/* Prompt cards get a very subtle page-edge gleam. */
.detailPromptSet,.panel,.editSection{position:relative;overflow:hidden}
.detailPromptSet:after,.editSection:after{
  content:"";position:absolute;pointer-events:none;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--fx-a),var(--fx-b),transparent);opacity:.35;
  animation:edgeGlow 5.5s ease-in-out infinite;
}

/* Modal arrival feels like a page settling on a desk. */
.overlay.open .modal{animation:modalPaperSettle .34s cubic-bezier(.2,.82,.28,1) both}
.overlay.open .modalHead h2{animation:titleInkIn .45s .08s ease both}
.close{transition:transform .18s ease,background .18s ease!important}
.close:hover{transform:rotate(5deg) scale(1.05)!important}
.close:active{transform:rotate(-4deg) scale(.94)!important}

/* Opening-book scene: more magical dust around the cover, without changing its timing. */
.bookOpeningStage:before,.bookOpeningStage:after{
  content:"✦";position:absolute;z-index:95;pointer-events:none;color:var(--fx-b);font-size:22px;opacity:0;
  text-shadow:0 0 16px currentColor;animation:openingSpark 2.55s ease both;
}
.bookOpeningStage:before{left:20%;top:24%}
.bookOpeningStage:after{right:18%;bottom:24%;color:var(--fx-c);animation-delay:.18s}
.openingBook:before,.openingBook:after{
  content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%;opacity:0;
  width:90px;height:90px;background:radial-gradient(circle,color-mix(in srgb,var(--fx-b) 42%,transparent),transparent 68%);
  filter:blur(3px);animation:bookGlowPuff 2.3s ease both;
}
.openingBook:before{left:12%;top:14%}.openingBook:after{right:8%;bottom:9%;background:radial-gradient(circle,color-mix(in srgb,var(--fx-c) 42%,transparent),transparent 68%);animation-delay:.2s}
.openingBook .bookNameplate{animation:nameplateBreath 2.6s ease-in-out infinite}
.openingBook .coverKicker{animation:kickerFloat 2.8s ease-in-out infinite}

/* A click sparkle/ripple created by JS. */
.uiClickFx{position:fixed;z-index:9999;pointer-events:none;width:8px;height:8px;border-radius:50%;border:2px solid var(--fx-a);transform:translate(-50%,-50%);animation:uiClickBurst .52s ease-out forwards}
.uiClickFx:before,.uiClickFx:after{content:"✦";position:absolute;left:50%;top:50%;font-size:10px;color:var(--fx-b);text-shadow:0 0 8px currentColor}

.uiClickFx:after{color:var(--fx-c);transform:translate(-50%,-50%) rotate(-20deg);animation:clickStarB .52s ease-out forwards}

<script>
(()=>{
'use strict';
const DEFAULT_SETTINGS={grid:'auto',sort:'manual',genre:'',role:'all',tag:'all',recentAdded:false,recentUpdated:false,detailPromptMode:'list',accentColor:'#6e67e8',secondaryColor:'#ff9fc5',decoColor:'#7bdcc5',siteTitle:'Prompt Atlas',siteLogo:'',shareSupabaseUrl:'',shareSupabaseAnonKey:'',lastShareSlug:'',sharePrompts:true,shareAlbum:true,cursorTheme:'hamster',cursorTrail:true,cursorTrailLength:48};
const now=()=>Date.now();
const uid=(p='id')=>`${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));

function plainDescriptionHtml(text){return esc(text||'').replace(/\n/g,'<br>')}
function sanitizeRichHtml(html){
 const box=document.createElement('div');box.innerHTML=String(html||'');
 const allowed=new Set(['B','STRONG','I','EM','U','BR','DIV','P','SPAN','FONT','MARK']);
 [...box.querySelectorAll('*')].forEach(el=>{
  if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);return}
  const styleVals={};
  ['color','background-color','font-family','font-weight','font-style','text-decoration','text-decoration-line'].forEach(prop=>{const v=el.style.getPropertyValue(prop);if(v)styleVals[prop]=v});
  const face=el.tagName==='FONT'?(el.getAttribute('face')||''):'';const color=el.tagName==='FONT'?(el.getAttribute('color')||''):'';
  [...el.attributes].forEach(a=>el.removeAttribute(a.name));
  Object.entries(styleVals).forEach(([k,v])=>el.style.setProperty(k,v));
  if(el.tagName==='FONT'&&face)el.setAttribute('face',face.replace(/[<>]/g,''));
  if(el.tagName==='FONT'&&color&&/^#[0-9a-f]{3,8}$/i.test(color))el.setAttribute('color',color);
 });
 box.innerHTML=box.innerHTML.replace(/\u200B/g,'');
 return box.innerHTML;
}
function descriptionHtml(ch){const html=String(ch?.descriptionHtml||'').trim();return html?sanitizeRichHtml(html):plainDescriptionHtml(ch?.description||'')}
function richPlainText(el){return String(el?.innerText||'').replace(/\u200B/g,'').replace(/\u00a0/g,' ').replace(/\n{3,}/g,'\n\n').trim()}
let descSavedRange=null;
function rememberDescriptionSelection(){const ed=$('#eDescRich');const sel=window.getSelection?.();if(!ed||!sel||!sel.rangeCount)return;const r=sel.getRangeAt(0);if(ed.contains(r.commonAncestorContainer))descSavedRange=r.cloneRange()}
function restoreDescriptionSelection(){const ed=$('#eDescRich');if(!ed)return;ed.focus();if(descSavedRange){const sel=window.getSelection();sel.removeAllRanges();sel.addRange(descSavedRange)}}
function syncDescriptionDraft(){const ed=$('#eDescRich');if(!ed||!editDraft)return;editDraft.descriptionHtml=sanitizeRichHtml(ed.innerHTML);editDraft.description=richPlainText(ed)}
function applyStyleToSavedDescriptionSelection(styleProp,value){
 const ed=$('#eDescRich');
 if(!ed||!descSavedRange||descSavedRange.collapsed||!ed.contains(descSavedRange.commonAncestorContainer)){toast('먼저 바꿀 글자를 드래그해서 선택해 주세요');return false}
 try{
  const range=descSavedRange.cloneRange();
  const span=document.createElement('span');
  span.style[styleProp]=value;
  const frag=range.extractContents();
  span.appendChild(frag);
  range.insertNode(span);
  const selected=document.createRange();selected.selectNodeContents(span);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(selected);
  descSavedRange=selected.cloneRange();
  syncDescriptionDraft();
  ed.focus({preventScroll:true});
  requestAnimationFrame(()=>{const s=window.getSelection();if(!s||!descSavedRange)return;s.removeAllRanges();s.addRange(descSavedRange)});
  return true;
 }catch(err){console.warn('rich style apply failed',err);toast('선택 영역에 서식을 적용하지 못했어요');return false}
}
function bindDescriptionEditor(){
 const ed=$('#eDescRich'),bar=$('#descRichToolbar');if(!ed||!bar)return;descSavedRange=null;
 const colorTool=$('#descTextColorTool'),hiTool=$('#descHighlightColorTool');
 const colorToggle=$('#descTextColorToggle'),hiToggle=$('#descHighlightToggle');
 const color=$('#descTextColor'),hi=$('#descHighlightColor');
 let activeColor=false,activeHighlight=false;
 const selectionInsideEditor=()=>{const sel=window.getSelection?.();if(!sel||!sel.rangeCount)return false;const r=sel.getRangeAt(0);return ed.contains(r.commonAncestorContainer)};
 const savedHasSelection=()=>!!(descSavedRange&&!descSavedRange.collapsed&&ed.contains(descSavedRange.commonAncestorContainer));
 const saveSel=()=>{if(selectionInsideEditor())rememberDescriptionSelection()};
 const keepSelection=()=>{if(!descSavedRange)return;requestAnimationFrame(()=>restoreDescriptionSelection())};
 const setPressed=(el,on)=>{if(!el)return;el.classList.toggle('active',!!on);el.setAttribute('aria-pressed',on?'true':'false')};
 const editorBaseStyles=()=>{const cs=getComputedStyle(ed);return{color:cs.color||'#30384a',backgroundColor:cs.backgroundColor&&cs.backgroundColor!=='rgba(0, 0, 0, 0)'?cs.backgroundColor:getComputedStyle(ed.parentElement||ed).backgroundColor||'#ffffff'}};
 const placeTypingSpan=(neutralize=false)=>{
  if(!descSavedRange){ed.focus();rememberDescriptionSelection()}
  restoreDescriptionSelection();
  const sel=window.getSelection?.();if(!sel||!sel.rangeCount)return;
  let range=sel.getRangeAt(0);if(!ed.contains(range.commonAncestorContainer))return;
  if(!range.collapsed){range.collapse(false)}
  const base=editorBaseStyles(),span=document.createElement('span');span.dataset.richTyping='1';
  if(activeColor&&color)span.style.color=color.value;else if(neutralize)span.style.color=base.color;
  if(activeHighlight&&hi)span.style.backgroundColor=hi.value;else if(neutralize)span.style.backgroundColor=base.backgroundColor;
  const marker=document.createTextNode('\u200B');span.appendChild(marker);range.insertNode(span);
  const nr=document.createRange();nr.setStart(marker,1);nr.collapse(true);sel.removeAllRanges();sel.addRange(nr);descSavedRange=nr.cloneRange();ed.focus({preventScroll:true});
 };
 const execAtCaret=(cmd,value=null)=>{
  restoreDescriptionSelection();
  try{document.execCommand('styleWithCSS',false,true)}catch(_){ }
  try{document.execCommand(cmd,false,value)}catch(_){ }
  syncDescriptionDraft();rememberDescriptionSelection();keepSelection();
 };
 const runCommand=(cmd,btn)=>{
  if(!descSavedRange){ed.focus();rememberDescriptionSelection()}
  restoreDescriptionSelection();
  try{document.execCommand('styleWithCSS',false,true)}catch(_){ }
  document.execCommand(cmd,false,null);
  syncDescriptionDraft();rememberDescriptionSelection();keepSelection();
  if(btn&&descSavedRange?.collapsed){let on=false;try{on=document.queryCommandState(cmd)}catch(_){on=btn.classList.contains('active')}setPressed(btn,on)}
 };
 // 선택 저장은 하되, 키를 누를 때마다 새 스타일 span을 만들지는 않습니다.
 // 이전 버전은 keyup마다 커서를 다시 만들면서 특히 한글/IME 입력에서 직전 글자가
 // 덮이거나 한 글자씩 사라지는 현상이 생길 수 있었습니다.
 ed.addEventListener('pointerup',()=>{
  saveSel();
  // 사용자가 마우스/터치로 커서를 다른 위치에 옮겼을 때만 새 입력 스타일을 준비합니다.
  if(descSavedRange?.collapsed&&(activeColor||activeHighlight))placeTypingSpan(false);
 });
 ed.addEventListener('focus',saveSel);
 ed.addEventListener('input',()=>{syncDescriptionDraft();saveSel()});
 document.addEventListener('selectionchange',()=>{if(document.activeElement===ed||selectionInsideEditor())saveSel()});
 bar.addEventListener('pointerdown',e=>{
  if(selectionInsideEditor())rememberDescriptionSelection();
  if(e.target.closest('button'))e.preventDefault();
 });
 bar.querySelectorAll('[data-rich-cmd]').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();runCommand(btn.dataset.richCmd,btn)}));
 const font=$('#descFontSelect');if(font){
  font.addEventListener('pointerdown',()=>{if(selectionInsideEditor())rememberDescriptionSelection()});
  font.addEventListener('change',()=>{
   if(!font.value)return;
   if(savedHasSelection())applyStyleToSavedDescriptionSelection('fontFamily',font.value);
   else{if(!descSavedRange){ed.focus();rememberDescriptionSelection()}execAtCaret('fontName',font.value)}
   font.value='';
  });
 }
 if(color){
  const applyColor=()=>{
   if(savedHasSelection()){applyStyleToSavedDescriptionSelection('color',color.value);return}
   activeColor=true;setPressed(colorToggle,true);colorTool?.classList.add('active');placeTypingSpan(false);
  };
  color.addEventListener('pointerdown',()=>{if(selectionInsideEditor())rememberDescriptionSelection()});
  color.addEventListener('mousedown',()=>{if(selectionInsideEditor())rememberDescriptionSelection()});
  color.addEventListener('change',applyColor);
  colorToggle?.addEventListener('click',e=>{
   e.preventDefault();if(selectionInsideEditor())rememberDescriptionSelection();
   if(savedHasSelection()){applyStyleToSavedDescriptionSelection('color',color.value);return}
   activeColor=!activeColor;setPressed(colorToggle,activeColor);colorTool?.classList.toggle('active',activeColor);placeTypingSpan(!activeColor);
  });
 }
 if(hi){
  const applyHighlight=()=>{
   if(savedHasSelection()){applyStyleToSavedDescriptionSelection('backgroundColor',hi.value);return}
   activeHighlight=true;setPressed(hiToggle,true);hiTool?.classList.add('active');placeTypingSpan(false);
  };
  hi.addEventListener('pointerdown',()=>{if(selectionInsideEditor())rememberDescriptionSelection()});
  hi.addEventListener('mousedown',()=>{if(selectionInsideEditor())rememberDescriptionSelection()});
  hi.addEventListener('change',applyHighlight);
  hiToggle?.addEventListener('click',e=>{
   e.preventDefault();if(selectionInsideEditor())rememberDescriptionSelection();
   if(savedHasSelection()){applyStyleToSavedDescriptionSelection('backgroundColor',hi.value);return}
   activeHighlight=!activeHighlight;setPressed(hiToggle,activeHighlight);hiTool?.classList.toggle('active',activeHighlight);placeTypingSpan(!activeHighlight);
  });
 }
}

const deepClone=o=>JSON.parse(JSON.stringify(o));

 {key:'pyre',label:'불 (Pyre)',color:'#d95c4d'},
 {key:'aqua',label:'물 (Aqua)',color:'#438cc9'},
 {key:'verde',label:'풀 (Verde)',color:'#5b9d6c'},
 {key:'fulmen',label:'번개 (Fulmen)',color:'#c7972b'},
 {key:'aero',label:'바람 (Aero)',color:'#56a8a4'},

function attributeFromTags(tags=[]){const s=new Set(tags||[]),out=[];if(s.has('모든 속성')||s.has('모든속성'))out.push('omni');for(const [tag,key] of [['불','pyre'],['물','aqua'],['풀','verde'],['번개','fulmen'],['바람','aero'],['얼음','glacies'],['무속성','non'],['빛','lumen'],['어둠','umbra']])if(s.has(tag))out.push(key);return [...new Set(out)]}

function classificationBadgesHtml(ch){return (ch.classifications||[]).map(id=>classificationBadgeHtml(ch.genre,id)).join('')}
function classificationNames(ch){return (ch.classifications||[]).map(id=>classificationDef(ch.genre,id)?.name).filter(Boolean)}

 {id:uid('genre'),name:'장르 2',color:'#4f9aa8',viewLocked:false,viewPasswordHash:'',classifications:defaultGenreClassifications(2)}
]}
function sampleCharacters(genres){
 const t=now(),g1=genres[0],g2=genres[1];
 const rows=[
  ['아르벨','차분한 청색 계열의 제복 캐릭터',g1.name,[g1.classifications[0].id],['aqua'],['남캐','제복'],['#6679e8','#72c8e8'],'handsome male, pale skin, short navy hair, side swept bangs, blue eyes, gentle gaze, lean body, white military uniform, blue sash, silver brooch, calm atmosphere'],

  ['이리스','은빛 장발과 보랏빛 눈을 가진 마도사',g2.name,[g2.classifications[0].id],['umbra','lumen'],['여캐','마법','장발'],['#9077c8','#d17db1'],'elegant female, very long silver hair, violet eyes, long eyelashes, slim, faint magic sigil, layered fantasy dress, crystal pendant, floating particles'],

 ];
 return rows.map((x,i)=>{const img=dataUrlFromText(x[0],...x[7]);return{id:uid('char'),name:x[0],description:x[1],genre:x[2],classifications:x[3],attributes:x[4],tags:x[5],favorite:i===0||i===3,privateLocked:false,cardImage:img,cardImageOriginal:img,cardImageOriginalName:`${x[0]}-card.svg`,cardImageOriginalType:'image/svg+xml',cardImageZoom:1,cardImageX:50,cardImageY:50,detailImage:img,detailImageOriginal:img,detailImageOriginalName:`${x[0]}-detail.svg`,detailImageOriginalType:'image/svg+xml',detailImageZoom:1,detailImageX:50,detailImageY:50,refs:[],chapters:[makeChapter('챕터 1',[makeBlock('기본 프롬프트',x[8]),makeBlock(i%2?'정장':'사복',i%2?'tailored suit, dress shirt':'casual knit, dark slacks')]),makeChapter('챕터 2',[makeBlock('추가 프롬프트','')])],createdAt:t-(i+1)*86400000,updatedAt:t-(i+1)*3600000,order:i};});
}

function migrateState(st){

 st.version=15; st.settings={...DEFAULT_SETTINGS,...(st.settings||{})};st.settings.siteLogo=String(st.settings.siteLogo||'');if(st.settings.sort==='favorite')st.settings.sort='manual';delete st.settings.favoriteOnly;
 const oldCategories=Array.isArray(st.categories)?st.categories:[];

 if(!Array.isArray(st.genres)||!st.genres.length){
   const derived=oldCategories.filter(c=>c&&c.name&&!['가이드','센티넬'].includes(c.name)).map(c=>({id:c.id||uid('genre'),name:c.name,color:c.color||'#6e67e8',viewLocked:false,viewPasswordHash:'',classifications:[]}));
   st.genres=derived.length?derived:defaultGenres();
 }
 st.genres=st.genres.map((g,i)=>({id:g.id||uid('genre'),name:g.name||`장르 ${i+1}`,color:g.color||'#6e67e8',viewLocked:!!g.viewLocked,viewPasswordHash:g.viewPasswordHash||'',classifications:Array.isArray(g.classifications)?g.classifications.map((r,ri)=>({id:r.id||uid('class'),name:r.name||`분류 ${ri+1}`,color:r.color||'#777d8a'})):[]}));
 const genreNames=()=>st.genres.map(g=>g.name);
 const getGenre=n=>st.genres.find(g=>g.name===n);
 const ensureClassification=(genreName,name,color)=>{if(!name)return null;const g=getGenre(genreName);if(!g)return null;let r=g.classifications.find(x=>x.name===name);if(!r){r={id:uid('class'),name,color:color||'#777d8a'};g.classifications.push(r)}return r.id};
 st.globalTags=Array.isArray(st.globalTags)?st.globalTags:[];
 st.characters.forEach(ch=>{

function syncTopFields(){if(!editDraft)return;editDraft.name=$('#eName')?.value||editDraft.name;editDraft.partner=$('#ePartner')?.value?.trim()||'';editDraft.albumNote=$('#eAlbumNote')?.value?.trim()||'';syncDescriptionDraft();editDraft.classifications=$$('[data-class-choice]:checked').map(el=>el.dataset.classChoice);editDraft.attributes=$$('[data-attr-choice]:checked').map(el=>el.dataset.attrChoice);editDraft.tags=parseTags($('#eTags')?.value||'').filter(t=>!RESERVED_TAGS.has(t))}

function reorderCharacter(id,mode){const ch=state.characters.find(c=>c.id===id);if(!ch)return;const arr=state.characters.filter(c=>c.genre===ch.genre).sort((a,b)=>a.order-b.order),i=arr.findIndex(c=>c.id===id);if(i<0)return;let j=i;if(mode==='first')j=0;if(mode==='prev')j=Math.max(0,i-1);if(mode==='next')j=Math.min(arr.length-1,i+1);if(mode==='last')j=arr.length-1;if(j===i){toast('이미 그 위치에 있어요');return}const [m]=arr.splice(i,1);arr.splice(j,0,m);arr.forEach((c,n)=>c.order=n);const saved=state.characters.find(c=>c.id===id);if(saved&&editDraft?.id===id)editDraft.order=saved.order;save();renderAll();toast('캐릭터 순서를 변경했어요')}
function duplicateEditedCharacter(){syncTopFields();syncPromptStructure();const c=deepClone(editDraft);c.id=uid('char');c.name=(c.name||'캐릭터')+' 복사본';c.createdAt=c.updatedAt=now();const same=state.characters.filter(x=>x.genre===c.genre);c.order=Math.max(-1,...same.map(x=>x.order))+1;(c.chapters||[]).forEach(chapter=>{chapter.id=uid('chapter');(chapter.promptBlocks||[]).forEach(b=>b.id=uid('block'))});state.characters.push(c);save();renderAll();toast('현재 내용으로 캐릭터 복사본을 만들었어요')}
function deleteEditedCharacter(){const id=editDraft?.id,ch=state.characters.find(c=>c.id===id);if(!ch)return;if(!confirm(`“${ch.name}” 캐릭터를 삭제할까요?`))return;state.characters=state.characters.filter(c=>c.id!==id);sessionPrivateUnlocks.delete(id);save();closeOverlay('editorOverlay');closeOverlay('detailOverlay');renderAll();toast('캐릭터를 삭제했어요')}

function deleteGenre(i){const g=state.genres[i];if(state.genres.length<=1){alert('장르는 최소 1개가 필요해요.');return}const members=state.characters.filter(ch=>ch.genre===g.name),fallback=state.genres.find((x,j)=>j!==i);if(!fallback)return;if(!confirm(`“${g.name}” 장르를 삭제할까요?\n이 장르의 캐릭터는 ${fallback.name}(으)로 이동됩니다.`))return;members.forEach(ch=>moveCharacterGenre(ch,fallback.name));sessionViewUnlocks.delete(g.id);state.genres.splice(i,1);if(state.settings.genre===g.name){state.settings.genre=fallback.name;state.settings.role='all'}save();renderManager();renderAll()}

function paCursorPngData(uri,hotX=2,hotY=2,fallback='auto',markerColor='#7d72ee'){
  if(!uri)return fallback;
  const safeColor=String(markerColor||'#7d72ee').replace(/[^#a-zA-Z0-9(),.%\s-]/g,'');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 54 54"><image href="${uri}" x="7" y="7" width="44" height="44" preserveAspectRatio="xMidYMid meet"/><path d="M2 1.5 L13 5.3 L8.4 8.1 L5.8 14 Z" fill="#ffffff" stroke="${safeColor}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="3.1" cy="2.7" r="1.15" fill="${safeColor}"/></svg>`;
  return `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}") ${hotX} ${hotY}, ${fallback}`;
}
function paCursorPreviewSvg(theme){
  if(theme.kind==='system')return `<svg class="cursorPreviewMain" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 3v25l7-6 5 11 5-2-5-11h12Z" fill="#fff" stroke="#596273" stroke-width="2" stroke-linejoin="round"/></svg>`;
  const a=`<img class="cursorExactPreview main" src="${theme.pointer}" alt="">`;
  const b=`<img class="cursorExactPreview" src="${theme.link}" alt="">`;
  const c=`<img class="cursorExactPreview text" src="${theme.text}" alt="">`;
  return a+b+c;
}
function applyCursorExperience(){
 const theme=paCursorTheme(state.settings.cursorTheme||'hamster');
 const root=document.documentElement;
 if(paCursorFine()&&theme.kind!=='system'){
   root.style.setProperty('--pa-cursor-default',paCursorPngData(theme.pointer,2,2,'auto',theme.main));
   root.style.setProperty('--pa-cursor-pointer',paCursorPngData(theme.link,2,2,'pointer',theme.main));
   root.style.setProperty('--pa-cursor-text',paCursorPngData(theme.text,2,2,'text',theme.main));
   root.classList.add('pa-custom-cursor');
 }else{
   root.classList.remove('pa-custom-cursor');
   root.style.removeProperty('--pa-cursor-default');root.style.removeProperty('--pa-cursor-pointer');root.style.removeProperty('--pa-cursor-text');
 }
 paEnsureTrail();
}

function paTrailEmitSegment(x1,y1,x2,y2,t){
 const dx=x2-x1,dy=y2-y1,dist=Math.hypot(dx,dy);if(!dist)return;
 const angle=Math.atan2(dy,dx);
 const speed=Math.min(1,dist/36);
 const spacing=22-speed*4;
 let traveled=spacing-paTrailCarry;
 while(traveled<=dist){
   const q=traveled/dist;
   paTrailStep++;
   paTrailPoints.push({
     x:x1+dx*q,y:y1+dy*q,born:t,
     life:540+Math.random()*160,
     angle,side:paTrailStep%2?1:-1,
     size:.76+Math.random()*.16,
     phase:Math.random()*Math.PI*2,
     colorIndex:paTrailStep%4,
     drift:(Math.random()-.5)*1.1
   });
   traveled+=spacing;
 }
 paTrailCarry=(paTrailCarry+dist)%spacing;
}
function paTrailMove(e){
 if(!state.settings.cursorTrail||!paCursorFine()||e.pointerType!=='mouse')return;
 const events=(typeof e.getCoalescedEvents==='function'&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
 const t=performance.now();
 for(const ev of events){
   const x=ev.clientX,y=ev.clientY;
   if(paLastTrailPoint)paTrailEmitSegment(paLastTrailPoint.x,paLastTrailPoint.y,x,y,t);
   paLastTrailPoint={x,y};
 }
 if(!paTrailRaf&&paTrailPoints.length)paTrailRaf=requestAnimationFrame(paTrailFrame);
}
function paDrawTrailGlyph(ctx,p,theme,k,age,maxAge,index){
 const fresh=Math.max(0,Math.min(1,k));
 const ease=fresh*fresh;
 const alpha=.055 + ease*.31;
 const nx=Math.cos(p.angle+Math.PI/2),ny=Math.sin(p.angle+Math.PI/2);
 const loosen=(p.side||1)*(3.7 + 2.4*Math.sin(p.phase+age*.002));
 const drift=(p.drift||0)*Math.min(7,age*.012);
 const x=p.x+nx*loosen + Math.cos(p.angle)*drift;
 const y=p.y+ny*loosen + Math.sin(p.angle)*drift - Math.min(4.5,age*.006);
 const size=(5.8+2.7*ease)*(p.size||1);
 const palette=[theme.main,theme.accent,paMixHex(theme.accent,'#ffffff',.58),paMixHex(theme.main,'#ffffff',.72)];
 const color=palette[p.colorIndex%palette.length],soft=paMixHex(theme.accent,'#ffffff',.5),pale=paMixHex(theme.main,'#ffffff',.72);
 if(theme.id==='cat'){
   paDrawPaw(ctx,x,y,size,color,alpha,p.angle+(p.side||1)*.08,p.phase);if(index%5===0)paStar(ctx,x+nx*8,y+ny*8,size*.14,soft,alpha*.45,p.angle+age*.001);
 }else if(theme.id==='dog'){
   paDrawPaw(ctx,x,y,size*.94,color,alpha,p.angle+(p.side||1)*.08,p.phase);if(index%7===0)paDrawBone(ctx,x+nx*9,y+ny*9,size*.5,soft,alpha*.34,p.angle+.1);
 }else if(theme.id==='rabbit'){
   if(index%4===0)paDrawHeart(ctx,x,y,size*.62,color,alpha*.92,p.angle*.08);else paDrawPaw(ctx,x,y,size*.65,color,alpha*.82,p.angle+(p.side||1)*.06,p.phase);
 }else if(theme.id==='hamster'){
   paDrawPaw(ctx,x,y,size*.68,color,alpha,p.angle+(p.side||1)*.06,p.phase);if(index%6===0)paDrawSeed(ctx,x+nx*8,y+ny*8,size*.46,soft,alpha*.3,p.angle+.45);
 }else if(theme.id==='blue'){
   paStar(ctx,x,y,size*.46,color,alpha,p.angle+age*.0007);if(index%5===0)paStar(ctx,x+nx*8,y+ny*8,size*.13,pale,alpha*.35,-p.angle);
 }else if(theme.id==='pink'){
   paDrawHeart(ctx,x,y,size*.58,color,alpha,p.angle*.08);if(index%7===0)paDrawBow(ctx,x+nx*8,y+ny*8,size*.42,soft,alpha*.28,p.angle+.2);
 }else if(theme.id==='mint'){
   paDrawPetal(ctx,x,y,size*.55,color,alpha,p.angle+.5);if(index%6===0)paStar(ctx,x+nx*8,y+ny*8,size*.13,soft,alpha*.3,p.angle);
 }else if(theme.id==='moon'){
   if(index%5===0){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,size*.31,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x+size*.14,y-size*.07,size*.28,0,Math.PI*2);ctx.fill();ctx.restore()}else paStar(ctx,x,y,size*.27,theme.accent,alpha*.7,p.angle+age*.0008);
 }else if(theme.id==='rose'){
   paDrawPetal(ctx,x,y,size*.54,color,alpha,p.angle+index*.25);if(index%8===0)paDrawMiniFlower(ctx,x+nx*8,y+ny*8,size*.38,theme.accent,'#ffd6bd',alpha*.28,p.angle);
 }else if(theme.id==='blackcat'){
   paDrawPaw(ctx,x,y,size*.72,color,alpha,p.angle+(p.side||1)*.06,p.phase);if(index%5===0)paStar(ctx,x+nx*8,y+ny*8,size*.13,theme.accent,alpha*.3,p.angle+age*.001);
 }else if(theme.id==='cherry'){
   if(index%4===0)paDrawMiniFlower(ctx,x,y,size*.42,color,'#fff0a8',alpha,p.angle+age*.0007);else paDrawPetal(ctx,x,y,size*.49,soft,alpha*.7,p.angle+.6);
 }else if(theme.id==='pixel'){
   ctx.save();ctx.globalAlpha=alpha*.78;ctx.fillStyle=color;const d=Math.max(1.6,size*.29);ctx.fillRect(x-d/2,y-d/2,d,d);ctx.restore();if(index%6===0)paDrawPixelHeart(ctx,x+nx*8,y+ny*8,size*.38,soft,alpha*.28);
 }else paStar(ctx,x,y,size*.4,color,alpha,p.angle);
}
function paTrailFrame(now){
 paTrailRaf=0;if(!paTrailCtx||!paTrailCanvas||paTrailCanvas.style.display==='none')return;
 const ctx=paTrailCtx;ctx.clearRect(0,0,innerWidth,innerHeight);
 const theme=paCursorTheme(state.settings.cursorTheme||'hamster');
 paTrailPoints=paTrailPoints.filter(p=>now-p.born<(p.life||600));
 for(let i=0;i<paTrailPoints.length;i++){
   const p=paTrailPoints[i],life=p.life||600,age=now-p.born,k=Math.max(0,1-age/life);if(k<=0)continue;
   paDrawTrailGlyph(ctx,p,theme,k,age,life,i);
 }
 if(paTrailPoints.length)paTrailRaf=requestAnimationFrame(paTrailFrame);
}
function paCursorSettingsHtml(){
 const active=state.settings.cursorTheme||'hamster',trail=state.settings.cursorTrail!==false;
 return `<div class="panel cursorSettingsPanel"><div class="panelHead"><div><h3>🖱️ 커스텀 커서 세트 · 샤랄라 꼬리</h3><span class="hint">참고 이미지에서 만든 커서 그림을 그대로 사용해요. 화이트 윙은 제외하고 햄스터를 추가했어요.</span></div></div><div class="cursorThemeGrid">${PA_CURSOR_THEMES.map(t=>`<button type="button" class="cursorThemeOption ${active===t.id?'active':''}" data-cursor-theme="${t.id}" style="--cursor-color:${t.main}"><span class="cursorThemePreview">${paCursorPreviewSvg(t)}</span><b>${t.name}</b><small>${t.sub}</small></button>`).join('')}</div><div class="cursorTrailBox"><div><div class="cursorTrailTitle"><i>✦</i> 자동 페이드 샤랄라 꼬리</div><span class="cursorTrailHint">길이 제한 없이 움직인 경로를 따라 이어지고, 이전보다 조금 더 또렷하게 보였다가 약 0.5~0.7초 안에 은은하게 사라져요. 커서 왼쪽 위 작은 삼각표가 실제 클릭 지점이에요.</span></div><label class="cursorToggle" title="스파클 꼬리 켜기/끄기"><input id="cursorTrailToggle" type="checkbox" ${trail?'checked':''}><span></span></label></div></div>`;
}
function paBindCursorSettings(){
 const body=document.getElementById('settingsBody');if(!body)return;
 const themePanel=body.querySelector('.kawaiiThemePanel');if(!themePanel)return;

// v1.41 · let content determine the required height, then make every visible card match the tallest one.
function equalizeVisibleCardHeights(){
  const grid=document.getElementById('grid');
  if(!grid)return;
  const cards=[...grid.querySelectorAll('.card')].filter(card=>card.offsetParent!==null);
  if(!cards.length)return;

  // First restore each card to its true natural content height.
  cards.forEach(card=>{
    card.style.setProperty('height','auto','important');
    card.style.removeProperty('min-height');
  });

  // Measure after the browser has laid out wrapped descriptions/tags at the current column width.
  const maxHeight=Math.max(...cards.map(card=>Math.ceil(card.getBoundingClientRect().height)));
  if(!Number.isFinite(maxHeight)||maxHeight<=0)return;
  cards.forEach(card=>card.style.setProperty('height',`${maxHeight}px`,'important'));
}
function scheduleCardEqualize(){
  requestAnimationFrame(()=>requestAnimationFrame(equalizeVisibleCardHeights));
}
const renderGrid_v129=renderGrid;

  renderGrid_v129();
  scheduleCardEqualize();

<script>
/* v1.38 visual-only ambient/click effects. */
(()=>{
  if(document.getElementById('ambientStoryFx')) return;
  const reduce=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){
    const layer=document.createElement('div');
    layer.id='ambientStoryFx';layer.setAttribute('aria-hidden','true');
    const count=window.matchMedia('(max-width:760px)').matches?12:22;
    for(let i=0;i<count;i++){
      const star=document.createElement('i');
      star.className='fxStar'+(i%4===0?' dot':'');
      const x=((i*47+13)%97)+1;
      const size=3+(i%4);
      const dur=10+(i%7)*1.35;
      const delay=-(i*1.17%12);
      const drift=((i%2?1:-1)*(14+(i%5)*9))+'px';
      star.style.setProperty('--x',x+'%');
      star.style.setProperty('--s',size+'px');
      star.style.setProperty('--dur',dur+'s');
      star.style.setProperty('--delay',delay+'s');
      star.style.setProperty('--drift',drift);
      layer.appendChild(star);
    }
    document.body.appendChild(layer);
  }
  const clickSel='.btn,.iconMini,.filterChip,.chapterTab,.genreManageBtn,.genreAddCharacter,.card';
  document.addEventListener('pointerdown',e=>{
    if(reduce||e.pointerType==='mouse'&&e.button!==0) return;
    if(!e.target.closest(clickSel)) return;
    const fx=document.createElement('span');fx.className='uiClickFx';fx.setAttribute('aria-hidden','true');
    fx.style.left=e.clientX+'px';fx.style.top=e.clientY+'px';document.body.appendChild(fx);
    setTimeout(()=>fx.remove(),620);
  },{passive:true});
})();
</script>
