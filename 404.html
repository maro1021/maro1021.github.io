/* v1.33 — Storybook theme + rapid page-flip character opening. Functional layout preserved. */
:root{
  --book-paper:color-mix(in srgb,#fffaf0 88%,var(--accent) 12%);
  --book-paper-2:color-mix(in srgb,#fffdf8 94%,var(--theme-secondary) 6%);
  --book-edge:color-mix(in srgb,#cbbf9d 72%,var(--accent) 28%);
  --book-ink:color-mix(in srgb,var(--text) 94%,#2f2619 6%);
  --book-desk:color-mix(in srgb,#e8dfcf 82%,var(--accent) 18%);
  --book-shadow:rgba(74,57,38,.16);
}
html[data-theme="dark"]{
  --book-paper:color-mix(in srgb,var(--panel) 91%,#8b7657 9%);
  --book-paper-2:color-mix(in srgb,var(--panel2) 94%,#9c8561 6%);
  --book-edge:color-mix(in srgb,var(--line) 70%,var(--accent) 30%);
  --book-ink:var(--text);
  --book-desk:color-mix(in srgb,var(--bg) 90%,#5d4c39 10%);
  --book-shadow:rgba(0,0,0,.34);
}
body{
  background:
    linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px) 0 0/26px 26px,
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/26px 26px,
    radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 26%),
    linear-gradient(180deg,color-mix(in srgb,var(--book-desk) 58%,var(--bg) 42%),var(--bg) 440px)!important;
  animation:none!important;
}
body:before,body:after,.app:before,.app:after,.controls:before,.brand:after,
.genreFilterGroup:after,.card:before,.card:after,.modalHead:before,.modalHead:after,
.kawaiiThemePanel:after,.previewSpark{display:none!important;content:none!important}

.app{position:relative}
.topbar{
  background:linear-gradient(180deg,color-mix(in srgb,var(--book-paper) 96%,white 4%),color-mix(in srgb,var(--book-paper-2) 96%,var(--accent) 4%))!important;
  border:1px solid var(--book-edge)!important;
  border-radius:18px!important;
  box-shadow:0 12px 28px var(--book-shadow),inset 0 1px 0 rgba(255,255,255,.7)!important;
  padding:10px 12px!important;
}
.brandMark{
  border-radius:9px!important;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#4b3b2b 30%))!important;
  box-shadow:4px 5px 0 color-mix(in srgb,var(--accent) 24%,var(--book-edge)),0 8px 20px var(--accent-glow)!important;
  animation:none!important;
}
.brand h1{font-family:Georgia,"Noto Serif KR",serif;letter-spacing:.2px}
.brand p{font-family:Georgia,"Noto Serif KR",serif}

.controls,.genreFilterGroup{
  background:
    repeating-linear-gradient(0deg,transparent 0 27px,color-mix(in srgb,var(--book-edge) 12%,transparent) 28px),
    linear-gradient(180deg,var(--book-paper-2),var(--book-paper))!important;
  border:1px solid var(--book-edge)!important;
  box-shadow:0 9px 22px var(--book-shadow),inset 8px 0 0 color-mix(in srgb,var(--accent) 12%,transparent)!important;
}
.genreFilterGroup{padding-left:18px!important}
.filterChip{
  background:var(--book-paper-2)!important;
  border-color:var(--book-edge)!important;
  box-shadow:0 2px 0 color-mix(in srgb,var(--book-edge) 55%,transparent)!important;
}
.filterChip.active,.roleFilterRow .filterChip.active{
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,white 8%),color-mix(in srgb,var(--accent) 83%,#4c3c2a 17%))!important;
  box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 45%,#4c3c2a),0 7px 14px var(--accent-glow)!important;
  animation:none!important;
}
.genreManageBtn,.genreAddCharacter,.btn,.iconMini,.close{
  box-shadow:0 3px 0 color-mix(in srgb,var(--book-edge) 70%,transparent),0 6px 12px rgba(45,35,24,.05)!important;
}
.genreAddCharacter,.btn.primary{animation:none!important}
.btn.primary:after,.genreAddCharacter:after{display:none!important}

.metaRow{font-family:Georgia,"Noto Serif KR",serif}
.sortWrap{background:var(--book-paper-2)!important;border-color:var(--book-edge)!important}

.card{
  background:var(--book-paper-2)!important;
  border:1px solid var(--book-edge)!important;
  border-radius:13px 18px 18px 13px!important;
  box-shadow:8px 10px 22px var(--book-shadow),inset 5px 0 0 color-mix(in srgb,var(--accent) 17%,var(--book-edge))!important;
  animation:bookCardIn .42s cubic-bezier(.2,.8,.3,1) both!important;
  transform-origin:left center;
}
.card:hover{transform:translateY(-3px) rotate(.2deg)!important;box-shadow:10px 16px 30px var(--book-shadow),inset 5px 0 0 color-mix(in srgb,var(--accent) 28%,var(--book-edge))!important}
.cover{border-bottom:1px solid var(--book-edge)!important}
.cardBody{
  background:
    repeating-linear-gradient(0deg,transparent 0 25px,color-mix(in srgb,var(--book-edge) 10%,transparent) 26px),
    linear-gradient(180deg,var(--book-paper-2),var(--book-paper))!important;
}
.titleLine h3,.detailTitle h2{font-family:Georgia,"Noto Serif KR",serif;color:var(--book-ink)!important}
.desc{color:color-mix(in srgb,var(--book-ink) 72%,var(--muted) 28%)!important}
.chip{background:color-mix(in srgb,var(--book-paper-2) 90%,var(--accent) 10%)!important;border-color:var(--book-edge)!important;box-shadow:none!important}
.iconMini{background:color-mix(in srgb,var(--book-paper-2) 95%,var(--accent) 5%)!important;border-color:var(--book-edge)!important}
.iconMini:hover{transform:translateY(-1px)!important}

.modal{
  border:1px solid var(--book-edge)!important;
  background:var(--book-paper-2)!important;
  box-shadow:0 32px 90px rgba(36,27,17,.32),0 10px 24px var(--book-shadow)!important;
  border-radius:16px!important;
}
.modalHead{
  background:linear-gradient(180deg,color-mix(in srgb,var(--book-paper-2) 96%,white 4%),var(--book-paper))!important;
  border-bottom:1px solid var(--book-edge)!important;
}
.modalHead h2{font-family:Georgia,"Noto Serif KR",serif;color:var(--book-ink)}
.modalFooter{background:var(--book-paper)!important;border-top-color:var(--book-edge)!important}
.panel,.editSection,.detailPromptSet,.combined,.empty,.lockMessage{
  background:
    repeating-linear-gradient(0deg,transparent 0 28px,color-mix(in srgb,var(--book-edge) 9%,transparent) 29px),
    linear-gradient(180deg,var(--book-paper-2),var(--book-paper))!important;
  border-color:var(--book-edge)!important;
  box-shadow:0 5px 14px rgba(70,54,33,.055)!important;
}
.detailPromptSet:before{display:none!important}

/* Character detail becomes an open book. */
#detailOverlay{perspective:1800px}
#detailOverlay .modal.wide{position:relative;overflow:hidden;background:var(--book-paper-2)!important}
#detailOverlay .modalHead{position:relative;z-index:25}
#detailOverlay .detailLayout{
  position:relative;
  background:var(--book-paper-2);
}
#detailOverlay .detailLayout:after{display:none!important;content:none!important}
#detailOverlay .detailImagePane{background:var(--book-paper)!important;border-right:0!important;box-shadow:none!important}
#detailOverlay .detailContent{
  background:
    repeating-linear-gradient(0deg,transparent 0 30px,color-mix(in srgb,var(--book-edge) 9%,transparent) 31px),
    linear-gradient(180deg,var(--book-paper-2),var(--book-paper));
  box-shadow:none!important;
}
#detailOverlay .detailTitle{border-bottom-color:var(--book-edge)!important}
.chapterTab{background:var(--book-paper-2)!important;border-color:var(--book-edge)!important}
.chapterTab.active{background:var(--accent)!important;color:#fff!important}

/* Rapid flutter sheets shown only while opening a character. */
.bookFlipCurtain{position:absolute;z-index:22;inset:55px 0 0 0;pointer-events:none;perspective:1800px;overflow:hidden}
.bookFlipCurtain .flipSheet{
  position:absolute;right:0;top:0;width:51%;height:100%;transform-origin:left center;
  background:
    linear-gradient(90deg,rgba(86,64,38,.08),transparent 9%),
    repeating-linear-gradient(0deg,transparent 0 30px,rgba(112,91,59,.055) 31px),
    var(--book-paper-2);
  border-left:1px solid var(--book-edge);
  box-shadow:-14px 0 24px rgba(55,40,22,.16);
  backface-visibility:hidden;
  animation:rapidPageFlip .46s cubic-bezier(.38,.05,.28,.98) forwards;
}
.bookFlipCurtain .flipSheet:nth-child(1){animation-delay:.00s}
.bookFlipCurtain .flipSheet:nth-child(2){animation-delay:.055s}
.bookFlipCurtain .flipSheet:nth-child(3){animation-delay:.11s}
.bookFlipCurtain .flipSheet:nth-child(4){animation-delay:.165s}
.bookFlipCurtain .flipSheet:nth-child(5){animation-delay:.22s}
.bookFlipCurtain .flipSheet:nth-child(6){animation-delay:.275s}
.bookFlipCurtain .flipSheet:nth-child(7){animation-delay:.33s}
#detailOverlay.book-opening .modal{animation:bookShellOpen .42s cubic-bezier(.2,.8,.3,1) both!important;transform-style:preserve-3d}

/* Theme setting surfaces follow the book design, but all custom color controls remain intact. */
.kawaiiThemePanel,.kawaiiPreview,.themeColorControl,.themePalette{
  background:linear-gradient(180deg,var(--book-paper-2),var(--book-paper))!important;
  border-color:var(--book-edge)!important;
  box-shadow:0 5px 14px rgba(70,54,33,.06)!important;

/* v1.38 — lively kawaii storybook effects. Visual-only: no app behavior/layout changes. */
:root{
  --fx-a:color-mix(in srgb,var(--accent) 72%,#ffffff 28%);
  --fx-b:color-mix(in srgb,var(--theme-secondary) 68%,#ffffff 32%);
  --fx-c:color-mix(in srgb,var(--theme-deco) 66%,#ffffff 34%);
}
body{position:relative;overflow-x:hidden}
body:before,body:after{
  content:"";position:fixed;pointer-events:none;z-index:-2;border-radius:50%;filter:blur(16px);opacity:.22;
  width:360px;height:360px;animation:storybookAura 12s ease-in-out infinite alternate;
}
body:before{left:-150px;top:15%;background:radial-gradient(circle,var(--fx-b),transparent 67%)}
body:after{right:-170px;top:52%;background:radial-gradient(circle,var(--fx-c),transparent 68%);animation-delay:-5s}

/* Floating ambient sparkles: intentionally tiny and non-interactive. */
#ambientStoryFx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2;contain:strict}
#ambientStoryFx .fxStar{
  --s:5px;position:absolute;left:var(--x);top:110%;width:var(--s);height:var(--s);opacity:0;
  color:var(--fx-a);filter:drop-shadow(0 0 7px color-mix(in srgb,currentColor 35%,transparent));
  animation:ambientFloat var(--dur) linear infinite;animation-delay:var(--delay);will-change:transform,opacity;
}
#ambientStoryFx .fxStar:nth-child(3n+2){color:var(--fx-b)}
#ambientStoryFx .fxStar:nth-child(3n){color:var(--fx-c)}
#ambientStoryFx .fxStar:before{content:"✦";display:block;font-size:calc(var(--s) * 2.2);line-height:1;animation:ambientTwinkle 1.9s ease-in-out infinite alternate}
#ambientStoryFx .fxStar.dot:before{content:"";width:var(--s);height:var(--s);border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}

/* Bookish top area: gentle shimmer instead of static decoration. */
.topbar{overflow:hidden}
.topbar:after{
  content:"";position:absolute;inset:-45% auto -45% -35%;width:30%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.34),transparent);transform:skewX(-18deg);
  animation:topbarGlint 8s ease-in-out infinite;
}
.brandMark{animation:brandBob 4.6s ease-in-out infinite}
.brandMark:before{
  content:"✦";position:absolute;right:-7px;top:-8px;font-size:12px;color:var(--fx-b);text-shadow:0 0 10px currentColor;
  animation:tinyStarPop 2.2s ease-in-out infinite;
}

/* Filter/chapter selections have a soft magical pulse, not extra badges. */
.filterChip.active,.chapterTab.active,.segment button.active{
  position:relative;isolation:isolate;
}
.filterChip.active:after,.chapterTab.active:after,.segment button.active:after{
  content:"";position:absolute;inset:-4px;border-radius:inherit;z-index:-1;pointer-events:none;
  border:1px solid color-mix(in srgb,var(--accent) 36%,transparent);opacity:0;
  animation:selectedHalo 2.8s ease-out infinite;
}

/* Cards feel like little illustrated books. */
.card{transform-origin:center bottom;animation:bookCardArrive .48s cubic-bezier(.2,.8,.22,1) both}
.card:nth-child(2){animation-delay:.045s}.card:nth-child(3){animation-delay:.09s}.card:nth-child(4){animation-delay:.135s}
.card:nth-child(5){animation-delay:.18s}.card:nth-child(6){animation-delay:.225s}.card:nth-child(n+7){animation-delay:.26s}
.card:after{
  content:"";position:absolute;z-index:5;pointer-events:none;inset:0;border-radius:inherit;opacity:0;
  background:linear-gradient(118deg,transparent 28%,rgba(255,255,255,.22) 43%,rgba(255,255,255,.38) 49%,transparent 61%);
  transform:translateX(-120%);transition:opacity .2s ease;
}
@media (hover:hover) and (pointer:fine){
  .card:hover{transform:translateY(-5px) rotate(.18deg)!important}
  .card:hover:after{opacity:1;animation:cardShine .8s ease forwards}
  .card:hover .cover img{transform:scale(1.025)}
  .btn:hover,.iconMini:hover,.filterChip:hover{box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 10%,transparent)}
}
.card:active{transform:translateY(-1px) scale(.992)!important}
.card .cover:after{

<script>
(()=>{
'use strict';
const DEFAULT_SETTINGS={grid:'auto',sort:'manual',genre:'',role:'all',tag:'all',recentAdded:false,recentUpdated:false,detailPromptMode:'list',accentColor:'#6e67e8',secondaryColor:'#ff9fc5',decoColor:'#7bdcc5',siteTitle:'Prompt Atlas',siteLogo:'',shareSupabaseUrl:'',shareSupabaseAnonKey:'',lastShareSlug:'',sharePrompts:true,shareAlbum:true};
const now=()=>Date.now();
const uid=(p='id')=>`${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));

function plainDescriptionHtml(text){return esc(text||'').replace(/\n/g,'<br>')}
function sanitizeRichHtml(html){
 const box=document.createElement('div');box.innerHTML=String(html||'');
 const allowed=new Set(['B','STRONG','I','EM','U','BR','DIV','P','SPAN','FONT','MARK']);
 [...box.querySelectorAll('*')].forEach(el=>{
  if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);return}
  const styleVals={};
  ['color','background-color','font-family','font-weight','font-style','text-decoration','text-decoration-line'].forEach(prop=>{const v=el.style.getPropertyValue(prop);if(v)styleVals[prop]=v});
  const face=el.tagName==='FONT'?(el.getAttribute('face')||''):'';const color=el.tagName==='FONT'?(el.getAttribute('color')||''):'';
  [...el.attributes].forEach(a=>el.removeAttribute(a.name));
  Object.entries(styleVals).forEach(([k,v])=>el.style.setProperty(k,v));
  if(el.tagName==='FONT'&&face)el.setAttribute('face',face.replace(/[<>]/g,''));
  if(el.tagName==='FONT'&&color&&/^#[0-9a-f]{3,8}$/i.test(color))el.setAttribute('color',color);
 });
 box.innerHTML=box.innerHTML.replace(/\u200B/g,'');
 return box.innerHTML;
}
function descriptionHtml(ch){const html=String(ch?.descriptionHtml||'').trim();return html?sanitizeRichHtml(html):plainDescriptionHtml(ch?.description||'')}
function richPlainText(el){return String(el?.innerText||'').replace(/\u200B/g,'').replace(/\u00a0/g,' ').replace(/\n{3,}/g,'\n\n').trim()}
let descSavedRange=null;
function rememberDescriptionSelection(){const ed=$('#eDescRich');const sel=window.getSelection?.();if(!ed||!sel||!sel.rangeCount)return;const r=sel.getRangeAt(0);if(ed.contains(r.commonAncestorContainer))descSavedRange=r.cloneRange()}
function restoreDescriptionSelection(){const ed=$('#eDescRich');if(!ed)return;ed.focus();if(descSavedRange){const sel=window.getSelection();sel.removeAllRanges();sel.addRange(descSavedRange)}}
function syncDescriptionDraft(){const ed=$('#eDescRich');if(!ed||!editDraft)return;editDraft.descriptionHtml=sanitizeRichHtml(ed.innerHTML);editDraft.description=richPlainText(ed)}
function applyStyleToSavedDescriptionSelection(styleProp,value){
 const ed=$('#eDescRich');
 if(!ed||!descSavedRange||descSavedRange.collapsed||!ed.contains(descSavedRange.commonAncestorContainer)){toast('먼저 바꿀 글자를 드래그해서 선택해 주세요');return false}
 try{
  const range=descSavedRange.cloneRange();
  const span=document.createElement('span');
  span.style[styleProp]=value;
  const frag=range.extractContents();
  span.appendChild(frag);
  range.insertNode(span);
  const selected=document.createRange();selected.selectNodeContents(span);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(selected);
  descSavedRange=selected.cloneRange();
  syncDescriptionDraft();
  ed.focus({preventScroll:true});
  requestAnimationFrame(()=>{const s=window.getSelection();if(!s||!descSavedRange)return;s.removeAllRanges();s.addRange(descSavedRange)});
  return true;
 }catch(err){console.warn('rich style apply failed',err);toast('선택 영역에 서식을 적용하지 못했어요');return false}
}
function bindDescriptionEditor(){
 const ed=$('#eDescRich'),bar=$('#descRichToolbar');if(!ed||!bar)return;descSavedRange=null;
 const colorTool=$('#descTextColorTool'),hiTool=$('#descHighlightColorTool');
 const colorToggle=$('#descTextColorToggle'),hiToggle=$('#descHighlightToggle');
 const color=$('#descTextColor'),hi=$('#descHighlightColor');
 let activeColor=false,activeHighlight=false;
 const selectionInsideEditor=()=>{const sel=window.getSelection?.();if(!sel||!sel.rangeCount)return false;const r=sel.getRangeAt(0);return ed.contains(r.commonAncestorContainer)};
 const savedHasSelection=()=>!!(descSavedRange&&!descSavedRange.collapsed&&ed.contains(descSavedRange.commonAncestorContainer));
 const saveSel=()=>{if(selectionInsideEditor())rememberDescriptionSelection()};
 const keepSelection=()=>{if(!descSavedRange)return;requestAnimationFrame(()=>restoreDescriptionSelection())};
 const setPressed=(el,on)=>{if(!el)return;el.classList.toggle('active',!!on);el.setAttribute('aria-pressed',on?'true':'false')};
 const editorBaseStyles=()=>{const cs=getComputedStyle(ed);return{color:cs.color||'#30384a',backgroundColor:cs.backgroundColor&&cs.backgroundColor!=='rgba(0, 0, 0, 0)'?cs.backgroundColor:getComputedStyle(ed.parentElement||ed).backgroundColor||'#ffffff'}};
 const placeTypingSpan=(neutralize=false)=>{
  if(!descSavedRange){ed.focus();rememberDescriptionSelection()}
  restoreDescriptionSelection();
  const sel=window.getSelection?.();if(!sel||!sel.rangeCount)return;
  let range=sel.getRangeAt(0);if(!ed.contains(range.commonAncestorContainer))return;
  if(!range.collapsed){range.collapse(false)}
  const base=editorBaseStyles(),span=document.createElement('span');span.dataset.richTyping='1';
  if(activeColor&&color)span.style.color=color.value;else if(neutralize)span.style.color=base.color;
  if(activeHighlight&&hi)span.style.backgroundColor=hi.value;else if(neutralize)span.style.backgroundColor=base.backgroundColor;
  const marker=document.createTextNode('\u200B');span.appendChild(marker);range.insertNode(span);
  const nr=document.createRange();nr.setStart(marker,1);nr.collapse(true);sel.removeAllRanges();sel.addRange(nr);descSavedRange=nr.cloneRange();ed.focus({preventScroll:true});
 };
 const execAtCaret=(cmd,value=null)=>{
  restoreDescriptionSelection();
  try{document.execCommand('styleWithCSS',false,true)}catch(_){ }
  try{document.execCommand(cmd,false,value)}catch(_){ }
  syncDescriptionDraft();rememberDescriptionSelection();keepSelection();
 };
 const runCommand=(cmd,btn)=>{
  if(!descSavedRange){ed.focus();rememberDescriptionSelection()}
  restoreDescriptionSelection();
  try{document.execCommand('styleWithCSS',false,true)}catch(_){ }
  document.execCommand(cmd,false,null);
  syncDescriptionDraft();rememberDescriptionSelection();keepSelection();
  if(btn&&descSavedRange?.collapsed){let on=false;try{on=document.queryCommandState(cmd)}catch(_){on=btn.classList.contains('active')}setPressed(btn,on)}
 };
 // 선택 저장은 하되, 키를 누를 때마다 새 스타일 span을 만들지는 않습니다.
 // 이전 버전은 keyup마다 커서를 다시 만들면서 특히 한글/IME 입력에서 직전 글자가
 // 덮이거나 한 글자씩 사라지는 현상이 생길 수 있었습니다.
 ed.addEventListener('pointerup',()=>{
  saveSel();
  // 사용자가 마우스/터치로 커서를 다른 위치에 옮겼을 때만 새 입력 스타일을 준비합니다.
  if(descSavedRange?.collapsed&&(activeColor||activeHighlight))placeTypingSpan(false);
 });
 ed.addEventListener('focus',saveSel);
 ed.addEventListener('input',()=>{syncDescriptionDraft();saveSel()});
 document.addEventListener('selectionchange',()=>{if(document.activeElement===ed||selectionInsideEditor())saveSel()});
 bar.addEventListener('pointerdown',e=>{
  if(selectionInsideEditor())rememberDescriptionSelection();
  if(e.target.closest('button'))e.preventDefault();
 });
 bar.querySelectorAll('[data-rich-cmd]').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();runCommand(btn.dataset.richCmd,btn)}));
 const font=$('#descFontSelect');if(font){
  font.addEventListener('pointerdown',()=>{if(selectionInsideEditor())rememberDescriptionSelection()});
  font.addEventListener('change',()=>{
   if(!font.value)return;
   if(savedHasSelection())applyStyleToSavedDescriptionSelection('fontFamily',font.value);
   else{if(!descSavedRange){ed.focus();rememberDescriptionSelection()}execAtCaret('fontName',font.value)}
   font.value='';
  });
 }
 if(color){
  const applyColor=()=>{
   if(savedHasSelection()){applyStyleToSavedDescriptionSelection('color',color.value);return}

function fileToDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}

async function stripMetadataDataUrl(dataUrl,maxSide=1800){const mime=dataUrlMime(dataUrl);if(mime==='image/svg+xml')return dataUrl;try{const img=await loadImage(dataUrl);const max=Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height);const scale=max>maxSide?maxSide/max:1;const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)),h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{alpha:true});ctx.drawImage(img,0,0,w,h);const outMime=mime==='image/jpeg'||mime==='image/webp'||mime==='image/png'?mime:'image/png';return canvas.toDataURL(outMime,outMime==='image/jpeg'||outMime==='image/webp'?0.92:undefined)}catch{return dataUrl}}

 <div class="panel"><div class="panelHead"><h3>전역 태그</h3><div class="inline"><input class="input" id="newGlobalTag" placeholder="새 태그" style="max-width:180px"><button class="btn small" id="addGlobalTagBtn">＋ 추가</button></div></div><div class="chips">${state.globalTags.map((t,i)=>`<span class="editChip"><span>#${esc(t)}</span><button data-edit-global="${i}">✎</button><button data-del-global="${i}">×</button></span>`).join('')}</div></div>`;
 const body=$('#managerBody');
 body.onchange=e=>{let v=e.target.dataset.genreColor;if(v!==undefined){state.genres[+v].color=e.target.value;save();renderAll();return}v=e.target.dataset.genreName;if(v!==undefined){renameGenre(+v,e.target.value,e.target);return}v=e.target.dataset.classColor;if(v!==undefined){const [gi,ri]=v.split(':').map(Number);state.genres[gi].classifications[ri].color=e.target.value;save();renderAll();return}v=e.target.dataset.className;if(v!==undefined){renameClassification(v,e.target.value,e.target);return}v=e.target.dataset.attrColor;if(v!==undefined){state.attributes[+v].color=e.target.value;save();renderAll();return}v=e.target.dataset.attrName;if(v!==undefined){const i=+v,n=e.target.value.trim(),old=state.attributes[i].label;if(!n){e.target.value=old;return}if(state.attributes.some((a,j)=>j!==i&&a.label===n)){alert('같은 이름의 속성이 이미 있어요.');e.target.value=old;return}state.attributes[i].label=n;save();renderAll();return}};
 body.onclick=async e=>{let x;const viewBtn=e.target.closest?.('[data-view-lock]');if(viewBtn){openGenreLockControl(+viewBtn.dataset.viewLock);return}if((x=e.target.dataset.genreUp)!==undefined){moveGenre(+x,-1);return}if((x=e.target.dataset.genreDown)!==undefined){moveGenre(+x,1);return}if((x=e.target.dataset.genreDel)!==undefined){deleteGenre(+x);return}if((x=e.target.dataset.addClass)!==undefined){addClassification(+x);return}if((x=e.target.dataset.classUp)!==undefined){moveClassification(x,-1);return}if((x=e.target.dataset.classDown)!==undefined){moveClassification(x,1);return}if((x=e.target.dataset.classDel)!==undefined){deleteClassification(x);return}if((x=e.target.dataset.attrUp)!==undefined){moveAttribute(+x,-1);return}if((x=e.target.dataset.attrDown)!==undefined){moveAttribute(+x,1);return}if((x=e.target.dataset.attrDel)!==undefined){deleteAttribute(+x);return}if((x=e.target.dataset.editGlobal)!==undefined){const i=+x,v=prompt('태그 수정',state.globalTags[i]);if(v?.trim()){const old=state.globalTags[i],n=v.trim();state.globalTags[i]=n;state.characters.forEach(c=>c.tags=c.tags.map(t=>t===old?n:t));save();renderManager();renderAll()}return}if((x=e.target.dataset.delGlobal)!==undefined){const i=+x,tag=state.globalTags[i];if(confirm(`#${tag} 태그를 전역 목록에서 삭제할까요?\n(캐릭터에 붙어 있는 태그도 함께 제거됩니다.)`)){state.globalTags.splice(i,1);state.characters.forEach(c=>c.tags=c.tags.filter(t=>t!==tag));save();renderManager();renderAll()}return}};
 $('#addGenreBtn').onclick=()=>{const name=prompt('새 장르 이름',`장르 ${state.genres.length+1}`);if(!name?.trim())return;const n=name.trim();if(state.genres.some(g=>g.name===n)){alert('같은 이름의 장르가 이미 있어요.');return}state.genres.push({id:uid('genre'),name:n,color:'#6e67e8',viewLocked:false,viewPasswordHash:'',classifications:[]});if(!state.settings.genre)state.settings.genre=n;save();renderManager();renderAll()};
 $('#addAttributeBtn').onclick=()=>{const name=prompt('새 속성 배지 이름','새 속성 (Custom)');if(!name?.trim())return;const n=name.trim();if(state.attributes.some(a=>a.label===n)){alert('같은 이름의 속성이 이미 있어요.');return}state.attributes.push({key:uid('attr'),label:n,color:'#7b78b8'});save();renderManager();renderAll()};
 $('#addGlobalTagBtn').onclick=()=>{const v=$('#newGlobalTag').value.trim();if(v&&!state.globalTags.includes(v)){state.globalTags.push(v);save();renderManager();renderAll()}};

}
function renameGenre(i,value,input){const g=state.genres[i];const old=g.name,n=value.trim();if(!n){input.value=old;return}if(state.genres.some((x,j)=>j!==i&&x.name===n)){alert('같은 이름의 장르가 이미 있어요.');input.value=old;return}g.name=n;state.characters.forEach(c=>{if(c.genre===old)c.genre=n});if(state.settings.genre===old)state.settings.genre=n;save();renderAll()}
function addClassification(gi){const g=state.genres[gi];const name=prompt(`“${g.name}”에 추가할 분류 이름`,'새 분류');if(!name?.trim())return;const n=name.trim();if(g.classifications.some(r=>r.name===n)){alert('이 장르에 같은 이름의 분류가 이미 있어요.');return}g.classifications.push({id:uid('class'),name:n,color:'#777d8a'});save();renderManager();renderAll()}
function renameClassification(token,value,input){const [gi,ri]=token.split(':').map(Number),g=state.genres[gi],r=g?.classifications?.[ri];if(!r)return;const old=r.name,n=value.trim();if(!n){input.value=old;return}if(g.classifications.some((x,j)=>j!==ri&&x.name===n)){alert('이 장르에 같은 이름의 분류가 이미 있어요.');input.value=old;return}r.name=n;save();renderAll()}
function moveClassification(token,d){const [gi,ri]=token.split(':').map(Number),g=state.genres[gi];const a=g?.classifications||[],j=ri+d;if(j<0||j>=a.length)return;[a[ri],a[j]]=[a[j],a[ri]];save();renderManager();renderAll()}
function deleteClassification(token){const [gi,ri]=token.split(':').map(Number),g=state.genres[gi],r=g?.classifications?.[ri];if(!r)return;if(!confirm(`“${r.name}” 분류를 삭제할까요?\n이 분류 체크는 캐릭터에서도 제거됩니다.`))return;state.characters.filter(c=>c.genre===g.name).forEach(c=>c.classifications=(c.classifications||[]).filter(id=>id!==r.id));if(state.settings.genre===g.name&&state.settings.role===r.id)state.settings.role='all';g.classifications.splice(ri,1);save();renderManager();renderAll()}
function moveAttribute(i,d){const j=i+d;if(j<0||j>=state.attributes.length)return;[state.attributes[i],state.attributes[j]]=[state.attributes[j],state.attributes[i]];save();renderManager();renderAll()}
function deleteAttribute(i){const a=state.attributes[i];if(!a)return;if(!confirm(`“${a.label}” 속성 배지를 삭제할까요?\n캐릭터에 선택된 이 속성도 함께 제거됩니다.`))return;state.characters.forEach(c=>c.attributes=(c.attributes||[]).filter(k=>k!==a.key));state.attributes.splice(i,1);save();renderManager();renderAll()}
function moveCharacterGenre(ch,targetName){const target=genreDef(targetName);const oldNames=classificationNames(ch);ch.genre=targetName;ch.classifications=(target?.classifications||[]).filter(r=>oldNames.includes(r.name)).map(r=>r.id);ch.updatedAt=now();return true}
function moveGenre(i,d){const j=i+d;if(j<0||j>=state.genres.length)return;[state.genres[i],state.genres[j]]=[state.genres[j],state.genres[i]];save();renderManager();renderAll()}
function deleteGenre(i){const g=state.genres[i];if(state.genres.length<=1){alert('장르는 최소 1개가 필요해요.');return}const members=state.characters.filter(ch=>ch.genre===g.name),fallback=state.genres.find((x,j)=>j!==i);if(!fallback)return;if(!confirm(`“${g.name}” 장르를 삭제할까요?\n이 장르의 캐릭터는 ${fallback.name}(으)로 이동됩니다.`))return;members.forEach(ch=>moveCharacterGenre(ch,fallback.name));sessionViewUnlocks.delete(g.id);state.genres.splice(i,1);if(state.settings.genre===g.name){state.settings.genre=fallback.name;state.settings.role='all'}save();renderManager();renderAll()}

function renderBackup(){const bytes=new Blob([JSON.stringify(state)]).size;$('#backupBody').innerHTML=`<div class="panel"><div class="panelHead"><h3>전체 백업</h3><span class="badge">약 ${(bytes/1024/1024).toFixed(2)} MB</span></div><p class="hint">캐릭터, 챕터별 프롬프트, 설정, 표시용 이미지와 원본 이미지 데이터를 JSON 하나에 저장합니다.</p><div class="inline"><button class="btn primary" id="downloadBackup">JSON 전체 백업</button><button class="btn" id="restoreBackup">JSON 전체 복원</button></div></div><div class="panel"><div class="panelHead"><h3>캐릭터 단위</h3></div><div class="inline"><select class="select" id="backupCharSelect">${state.characters.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="btn" id="exportOne">선택 캐릭터 내보내기</button><button class="btn" id="importOne">캐릭터 불러오기</button></div></div><div class="panel"><h3>로컬 저장 안내</h3><p class="hint">이 파일은 서버나 계정에 업로드되지 않습니다. 같은 브라우저/같은 파일 환경에서 자동 저장됩니다. 브라우저 데이터 삭제에 대비해 JSON 백업을 권장합니다.</p></div>`;

function downloadJson(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

function exportCharacter(id){const ch=state.characters.find(c=>c.id===id);downloadJson({type:'prompt-atlas-character',version:14,character:ch},`character-${ch.name}.json`);toast('캐릭터 파일을 만들었어요')}
async function importJsonFile(file,one=false){try{const text=await file.text(),obj=JSON.parse(text);if(one){const ch=obj.character||obj;if(!ch.name)throw Error();const c=migrateState({characters:[deepClone(ch)],genres:deepClone(state.genres),attributes:deepClone(state.attributes),globalTags:state.globalTags,settings:state.settings}).characters[0];c.id=uid('char');(c.chapters||[]).forEach(chapter=>{chapter.id=uid('chapter');(chapter.promptBlocks||[]).forEach(b=>b.id=uid('block'))});c.createdAt=c.updatedAt=now();c.order=Math.max(-1,...state.characters.map(x=>x.order))+1;state.characters.push(c);if(c.genre&&!state.genres.some(g=>g.name===c.genre))state.genres.push({id:uid('genre'),name:c.genre,color:'#6e67e8',viewLocked:false,viewPasswordHash:'',classifications:[]});c.tags?.forEach(t=>{if(!state.globalTags.includes(t))state.globalTags.push(t)});save();renderAll();toast('캐릭터를 불러왔어요')}else{if(!obj.characters||(!obj.genres&&!obj.categories))throw Error();if(!confirm('현재 데이터를 이 백업 내용으로 교체할까요?'))return;state=migrateState(obj);save();renderAll();toast('백업을 복원했어요')}}catch{alert('올바른 Prompt Atlas JSON 파일이 아닙니다.')}}

// v1.41 · let content determine the required height, then make every visible card match the tallest one.
function equalizeVisibleCardHeights(){
  const grid=document.getElementById('grid');
  if(!grid)return;
  const cards=[...grid.querySelectorAll('.card')].filter(card=>card.offsetParent!==null);
  if(!cards.length)return;

  // First restore each card to its true natural content height.
  cards.forEach(card=>{
    card.style.setProperty('height','auto','important');
    card.style.removeProperty('min-height');
  });

  // Measure after the browser has laid out wrapped descriptions/tags at the current column width.
  const maxHeight=Math.max(...cards.map(card=>Math.ceil(card.getBoundingClientRect().height)));
  if(!Number.isFinite(maxHeight)||maxHeight<=0)return;
  cards.forEach(card=>card.style.setProperty('height',`${maxHeight}px`,'important'));
}
function scheduleCardEqualize(){
  requestAnimationFrame(()=>requestAnimationFrame(equalizeVisibleCardHeights));
}
const renderGrid_v129=renderGrid;

  renderGrid_v129();

/* v1.38 visual-only ambient/click effects. */
(()=>{
  if(document.getElementById('ambientStoryFx')) return;
  const reduce=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){
    const layer=document.createElement('div');
    layer.id='ambientStoryFx';layer.setAttribute('aria-hidden','true');
    const count=window.matchMedia('(max-width:760px)').matches?12:22;
    for(let i=0;i<count;i++){
      const star=document.createElement('i');
      star.className='fxStar'+(i%4===0?' dot':'');
      const x=((i*47+13)%97)+1;
      const size=3+(i%4);
      const dur=10+(i%7)*1.35;
      const delay=-(i*1.17%12);
      const drift=((i%2?1:-1)*(14+(i%5)*9))+'px';
      star.style.setProperty('--x',x+'%');
      star.style.setProperty('--s',size+'px');
      star.style.setProperty('--dur',dur+'s');
      star.style.setProperty('--delay',delay+'s');
      star.style.setProperty('--drift',drift);
      layer.appendChild(star);
    }
    document.body.appendChild(layer);
  }
  const clickSel='.btn,.iconMini,.filterChip,.chapterTab,.genreManageBtn,.genreAddCharacter,.card';
  document.addEventListener('pointerdown',e=>{
    if(reduce||e.pointerType==='mouse'&&e.button!==0) return;
    if(!e.target.closest(clickSel)) return;
    const fx=document.createElement('span');fx.className='uiClickFx';fx.setAttribute('aria-hidden','true');
    fx.style.left=e.clientX+'px';fx.style.top=e.clientY+'px';document.body.appendChild(fx);
    setTimeout(()=>fx.remove(),620);
  },{passive:true});
})();
